<header class="header">
  <div class="container">
    <div class="header__inner">
      <div class="header__logo">
        <img src="/assets/images/logo.svg" alt="Bank logo" class="header__logo-image" width="156" height="40" />
      </div>

      <nav class="header__nav" id="header-navigation" aria-label="Main navigation">
        <ul class="header__nav-list">
          <li class="header__nav-item">
            <a href="/" class="header__nav-link"{{#if isHome}} aria-current="page"{{/if}}>Home</a>
          </li>
          <li class="header__nav-item">
            <a href="/careers.html" class="header__nav-link"{{#if isCareers}} aria-current="page"{{/if}}>Careers</a>
          </li>
          <li class="header__nav-item">
            <a href="/about.html" class="header__nav-link"{{#if isAbout}} aria-current="page"{{/if}}>About</a>
          </li>
          <li class="header__nav-item">
            <a href="/security.html" class="header__nav-link"{{#if isSecurity}} aria-current="page"{{/if}}>Security</a>
          </li>
        </ul>
      </nav>

      <button
        id="header-menu-toggle"
        type="button"
        class="header__menu-toggle"
        aria-label="Open menu"
        aria-controls="header-navigation"
        aria-expanded="false"
      >
        <span class="header__menu-line" aria-hidden="true"></span>
        <span class="header__menu-line" aria-hidden="true"></span>
        <span class="header__menu-line" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>
