<div class="case-item{{#if inverted}} case-item--inverted{{/if}}">
  <div class="case-item__icons">
    {{#each icons}}
    <div class="case-item__icon">
      <div class="case-item__icon-image">
        <img src="{{src}}" width="78" height="78" alt="" aria-hidden="true" />
      </div>
      <h3 class="case-item__icon-title">{{title}}</h3>
    </div>
    {{/each}}
  </div>
  <div class="case-item__info">
    <h3 class="case-item__info-title">{{title}}</h3>
    <div class="case-item__info-text">{{description}}</div>
    <div class="case-item__stats">
      {{#each stats}}
      <div class="case-item__stat">
        <div class="case-item__stat-number">{{value}}</div>
        <div class="case-item__stat-text">{{label}}</div>
      </div>
      {{#unless @last}}
      <div class="case-item__stat-divider" aria-hidden="true"></div>
      {{/unless}} {{/each}}
    </div>
    <button type="button" class="button button--secondary case-item__button">
      Learn More
    </button>
  </div>
</div>
