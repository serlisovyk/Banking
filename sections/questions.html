<section class="questions section">
  <div class="container">
    <div class="questions__inner">
      <div class="questions__heading">
        <h2 class="questions__title"><span>Frequently</span> Asked Questions</h2>
        <div class="questions__text">
          Still you have any questions? Contact our Team via support@yourbank.com
        </div>
      </div>
      <div class="questions__content">
        <div class="questions__items">
          {{#each questionGroups.initial}} {{> question-item}} {{/each}}
        </div>
        <div class="questions__more" id="questions-more" inert>
          <div class="questions__items">
            {{#each questionGroups.additional}} {{> question-item}} {{/each}}
          </div>
        </div>
        <button
          type="button"
          class="questions__button button button--secondary"
          data-questions-toggle
          aria-controls="questions-more"
          aria-expanded="false"
        >
          <span data-questions-toggle-label>Load All FAQ’s</span>
          <img
            src="/images/icons/small-arrow.svg"
            width="22"
            height="22"
            alt=""
            aria-hidden="true"
          />
        </button>
      </div>
    </div>
  </div>
</section>
